[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "degradation-mot"
version = "0.1.0"
description = "Reference implementation of degradation-conditioned probabilistic multi-object tracking"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "opencv-python>=4.8,<5",
    "torch>=2.2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.3,<2"]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

